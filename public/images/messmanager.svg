        <text x="260" y="0">ROOM</text>
        <text x="380" y="0">MEAL UNITS</text>
        <text x="530" y="0">FOOD COST</text>
        <text x="690" y="0">SHARED OVERHEAD</text>
        <text x="880" y="0">TOTAL DEPOSIT</text>
        <text x="1060" y="0">NET BALANCE</text>
        <text x="1230" y="0">STATUS</text>
      </g>

      <!-- Row 1 (Saikat / Manager) -->
      <g transform="translate(0, 50)">
        <rect width="1400" height="66" fill="#1e293b" opacity="0.3"/>
        <line x1="0" y1="66" x2="1400" y2="66" stroke="#1f2937" stroke-width="1"/>
        <g transform="translate(30, 38)" font-family="system-ui, -apple-system, sans-serif">
          <text x="0" y="0" font-size="14" font-weight="700" fill="#ffffff">Mazharul Islam Saikat <tspan font-size="11" fill="#f59e0b">(Manager)</tspan></text>
          <text x="260" y="0" font-size="13" fill="#cbd5e1">Room 304</text>
          <text x="380" y="0" font-size="13" font-weight="600" fill="#ffffff">46.5 units</text>
          <text x="530" y="0" font-size="13" fill="#cbd5e1">৳ 3,719</text>
          <text x="690" y="0" font-size="13" fill="#cbd5e1">৳ 361</text>
          <text x="880" y="0" font-size="13" font-weight="600" fill="#38bdf8">৳ 5,500 (bKash)</text>
          <text x="1060" y="0" font-size="14" font-weight="700" fill="#34d399">+৳ 1,420</text>

          <rect x="1230" y="-18" width="85" height="26" rx="13" fill="#065f46"/>
          <text x="1272" y="-1" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">SURPLUS</text>
        </g>
      </g>

      <!-- Row 2 (Tanvir) -->
      <g transform="translate(0, 116)">
        <rect width="1400" height="66" fill="#111827"/>
        <line x1="0" y1="66" x2="1400" y2="66" stroke="#1f2937" stroke-width="1"/>
        <g transform="translate(30, 38)" font-family="system-ui, -apple-system, sans-serif">
          <text x="0" y="0" font-size="14" font-weight="600" fill="#ffffff">Tanvir Ahmed</text>
          <text x="260" y="0" font-size="13" fill="#cbd5e1">Room 304</text>
          <text x="380" y="0" font-size="13" font-weight="600" fill="#ffffff">54.0 units</text>
          <text x="530" y="0" font-size="13" fill="#cbd5e1">৳ 4,319</text>
          <text x="690" y="0" font-size="13" fill="#cbd5e1">৳ 361</text>
          <text x="880" y="0" font-size="13" font-weight="600" fill="#38bdf8">৳ 4,000 (Nagad)</text>
          <text x="1060" y="0" font-size="14" font-weight="700" fill="#f87171">-৳ 680</text>

          <rect x="1230" y="-18" width="85" height="26" rx="13" fill="#991b1b"/>
          <text x="1272" y="-1" font-size="11" font-weight="700" fill="#fecaca" text-anchor="middle">DUE</text>
        </g>
      </g>

      <!-- Row 3 (Rafiqul) -->
      <g transform="translate(0, 182)">
        <rect width="1400" height="66" fill="#1e293b" opacity="0.3"/>
        <line x1="0" y1="66" x2="1400" y2="66" stroke="#1f2937" stroke-width="1"/>
        <g transform="translate(30, 38)" font-family="system-ui, -apple-system, sans-serif">
          <text x="0" y="0" font-size="14" font-weight="600" fill="#ffffff">Rafiqul Islam</text>
          <text x="260" y="0" font-size="13" fill="#cbd5e1">Room 306</text>
          <text x="380" y="0" font-size="13" font-weight="600" fill="#ffffff">39.0 units</text>
          <text x="530" y="0" font-size="13" fill="#cbd5e1">৳ 3,119</text>
          <text x="690" y="0" font-size="13" fill="#cbd5e1">৳ 361</text>
          <text x="880" y="0" font-size="13" font-weight="600" fill="#38bdf8">৳ 4,500 (Bank)</text>
          <text x="1060" y="0" font-size="14" font-weight="700" fill="#34d399">+৳ 1,020</text>

          <rect x="1230" y="-18" width="85" height="26" rx="13" fill="#065f46"/>
          <text x="1272" y="-1" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">SURPLUS</text>
        </g>
      </g>

      <!-- Row 4 (Shahadat) -->
      <g transform="translate(0, 248)">
        <rect width="1400" height="66" fill="#111827"/>
        <line x1="0" y1="66" x2="1400" y2="66" stroke="#1f2937" stroke-width="1"/>
        <g transform="translate(30, 38)" font-family="system-ui, -apple-system, sans-serif">
          <text x="0" y="0" font-size="14" font-weight="600" fill="#ffffff">Shahadat Hossain</text>
          <text x="260" y="0" font-size="13" fill="#cbd5e1">Room 308</text>
          <text x="380" y="0" font-size="13" font-weight="600" fill="#ffffff">49.5 units</text>
          <text x="530" y="0" font-size="13" fill="#cbd5e1">৳ 3,959</text>
          <text x="690" y="0" font-size="13" fill="#cbd5e1">৳ 361</text>
          <text x="880" y="0" font-size="13" font-weight="600" fill="#38bdf8">৳ 5,000 (bKash)</text>
          <text x="1060" y="0" font-size="14" font-weight="700" fill="#34d399">+৳ 680</text>

          <rect x="1230" y="-18" width="85" height="26" rx="13" fill="#065f46"/>
          <text x="1272" y="-1" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">SURPLUS</text>
        </g>
      </g>

      <!-- Bottom Summary Footer Bar -->
      <g transform="translate(0, 314)">
        <rect width="1400" height="136" rx="14" fill="#0b1120"/>
        <g transform="translate(30, 45)" font-family="system-ui, -apple-system, sans-serif">
          <text x="0" y="0" font-size="13" font-weight="700" fill="#94a3b8">MONTH-END AUDIT SUMMARY:</text>
          <text x="210" y="0" font-size="13" fill="#cbd5e1">Total Deposit Pool: <tspan font-weight="700" fill="#38bdf8">৳ 82,000</tspan></text>
          <text x="460" y="0" font-size="13" fill="#cbd5e1">Total Mess Outflow: <tspan font-weight="700" fill="#f87171">৳ 45,100</tspan></text>
          <text x="730" y="0" font-size="13" fill="#cbd5e1">Remaining Reserve: <tspan font-weight="700" fill="#34d399">৳ 36,900</tspan></text>

          <rect x="1040" y="-22" width="290" height="44" rx="8" fill="url(#amberGrad)"/>
          <text x="1185" y="5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Export Full PDF &amp; Excel Report</text>

          <text x="0" y="45" font-size="12" fill="#64748b">Verified with Supabase RLS &amp; Automated calculation testing suite (vitest &amp; jest)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
