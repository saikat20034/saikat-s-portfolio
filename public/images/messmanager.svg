      <rect y="36" width="1400" height="14" fill="#1e293b"/>
      <line x1="0" y1="50" x2="1400" y2="50" stroke="#334155" stroke-width="1"/>

      <g transform="translate(30, 32)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">
